apiVersion: apps/v1
kind: Deployment
metadata:
  name: bob-runner
  labels:
    app: bob-chat-assistant
    component: bob-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bob-chat-assistant
      component: bob-runner
  template:
    metadata:
      labels:
        app: bob-chat-assistant
        component: bob-runner
    spec:
      containers:
        - name: bob-runner
          image: image-registry.openshift-image-registry.svc:5000/sre-demo/bob-runner:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - secretRef:
                name: bob-credentials
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: bob-runner-service
  labels:
    app: bob-chat-assistant
    component: bob-runner
spec:
  selector:
    app: bob-chat-assistant
    component: bob-runner
  ports:
    - port: 8081
      targetPort: 8081
