apiVersion: apps/v1
kind: Deployment
metadata:
  name: bob-runner
  labels:
    app: bob-chat-assistant
    component: bob-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bob-chat-assistant
      component: bob-runner
  template:
    metadata:
      labels:
        app: bob-chat-assistant
        component: bob-runner
    spec:
      # Longer than MAX_TIMEOUT_SECONDS so in-flight runs can finish on rollout
      terminationGracePeriodSeconds: 630
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bob-runner
          image: image-registry.openshift-image-registry.svc:5000/sre-demo/bob-runner:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8081
          envFrom:
            - secretRef:
                name: bob-credentials
            # OCP_TOKEN + OCP_API_URL for `oc login` in openshift-sre mode (never commit values)
            - secretRef:
                name: ocp-credentials
                optional: true
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bob-runner-api
                  key: API_TOKEN
            - name: MAX_CONCURRENT_RUNS
              value: "2"
            - name: DEFAULT_TIMEOUT_SECONDS
              value: "180"
            - name: MAX_TIMEOUT_SECONDS
              value: "600"
            - name: BOB_WORKSPACE
              value: /workspace
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: workspace
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: bob-runner-service
  labels:
    app: bob-chat-assistant
    component: bob-runner
spec:
  selector:
    app: bob-chat-assistant
    component: bob-runner
  ports:
    - port: 8081
      targetPort: 8081
---
# External API. Route timeout must exceed MAX_TIMEOUT_SECONDS (default is 30s).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: bob-runner-api
  labels:
    app: bob-chat-assistant
    component: bob-runner
  annotations:
    haproxy.router.openshift.io/timeout: 660s
spec:
  to:
    kind: Service
    name: bob-runner-service
    weight: 100
  port:
    targetPort: 8081
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
