# Instana MCP server (https://github.com/instana/mcp-instana), streamable HTTP on :8080.
# No credentials are stored here: MCP clients send Instana headers with each request.
# Build: oc start-build mcp-instana -n sre-demo --from-dir=<mcp-instana clone> --follow
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-instana
  labels:
    app: mcp-instana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-instana
  template:
    metadata:
      labels:
        app: mcp-instana
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-instana
          image: image-registry.openshift-image-registry.svc:5000/sre-demo/mcp-instana:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-instana
  labels:
    app: mcp-instana
spec:
  selector:
    app: mcp-instana
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mcp-instana
  labels:
    app: mcp-instana
spec:
  to:
    kind: Service
    name: mcp-instana
    weight: 100
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
