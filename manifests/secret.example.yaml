# TEMPLATE — copy to the same name without '.example' (git-ignored) and fill in real values.
apiVersion: v1
kind: Secret
metadata:
  name: sre-credentials
  namespace: sre-demo
  labels:
    app: agentic-sre
type: Opaque
stringData:
  # Bob inference API key — Bob 2.x reads BOBSHELL_API_KEY for headless auth
  BOBSHELL_API_KEY: "REPLACE_ME"
  # Bob SaaS gateway endpoint — Bob 2.x reads BOB_GATEWAY_URL automatically
  BOB_GATEWAY_URL: "https://api.us-east.bob.ibm.com"
  # Instana credentials (unchanged)
  INSTANA_BASE_URL: "https://<tenant>-<unit>.instana.io"
  INSTANA_API_TOKEN: "REPLACE_ME"
  # Target OCP cluster API URL and Token (Robot Shop cluster)
  OCP_API_URL: "https://api.<robot-shop-cluster>:6443"
  OCP_TOKEN: "REPLACE_ME"
  SLACK_WEBHOOK_URL: ""
