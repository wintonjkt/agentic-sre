---
# ImageStream for the bob-chat-ui image
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: bob-chat-ui
  namespace: sre-demo
  labels:
    app: agentic-sre
    component: bob-chat-ui
spec:
  lookupPolicy:
    local: true
---
# BuildConfig — sources from services/bob-chat-ui/ in the repo
# Build context is the repo root (Dockerfile uses COPY services/bob-chat-ui/...)
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: bob-chat-ui
  namespace: sre-demo
  labels:
    app: agentic-sre
    component: bob-chat-ui
spec:
  source:
    type: Git
    git:
      uri: https://github.com/wintonjkt/agentic-sre.git
      ref: main
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: services/bob-chat-ui/Dockerfile
      env:
        - name: DOCKER_BUILDKIT
          value: "1"
  output:
    to:
      kind: ImageStreamTag
      name: bob-chat-ui:latest
  resources:
    limits:
      cpu: "500m"
      memory: 1Gi
    requests:
      cpu: "200m"
      memory: 256Mi
  successfulBuildsHistoryLimit: 3
  failedBuildsHistoryLimit: 3
---
# Deployment — mounts the shared sre-workspace PVC for saved-prompts storage
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bob-chat-ui
  namespace: sre-demo
  labels:
    app: agentic-sre
    component: bob-chat-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bob-chat-ui
  template:
    metadata:
      labels:
        app: bob-chat-ui
        app.kubernetes.io/component: bob-chat-ui
    spec:
      serviceAccountName: sre-agent
      containers:
        - name: bob-chat-ui
          image: image-registry.openshift-image-registry.svc:5000/sre-demo/bob-chat-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: CONTEXT_MANAGER_URL
              value: "http://context-manager-service:8080"
            - name: SAVED_PROMPTS_DIR
              value: "/workspace/saved-prompts"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: sre-workspace
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: bob-chat-ui
  namespace: sre-demo
  labels:
    app: agentic-sre
    component: bob-chat-ui
spec:
  selector:
    app: bob-chat-ui
  ports:
    - port: 3001
      targetPort: 3001
      name: http
---
# Route — HTTPS edge TLS termination
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: bob-chat-ui
  namespace: sre-demo
  labels:
    app: agentic-sre
    component: bob-chat-ui
spec:
  to:
    kind: Service
    name: bob-chat-ui
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
