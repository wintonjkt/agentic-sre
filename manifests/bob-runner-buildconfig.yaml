---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: bob-runner
  namespace: sre-demo
  labels:
    app: bob-chat-assistant
spec:
  lookupPolicy:
    local: true
---
# Binary build: push local source with
#   oc start-build bob-runner -n sre-demo --from-dir=. --follow
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: bob-runner
  namespace: sre-demo
  labels:
    app: bob-chat-assistant
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: services/bob-runner/Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: bob-runner:latest
  resources:
    limits:
      cpu: "1"
      memory: 2Gi
    requests:
      cpu: "300m"
      memory: 512Mi
