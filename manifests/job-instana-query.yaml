apiVersion: batch/v1
kind: Job
metadata:
  name: instana-query-job
  namespace: sre-demo
  labels:
    app: agentic-sre
    agent: instana-query
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: agentic-sre
        agent: instana-query
    spec:
      restartPolicy: Never
      initContainers:
        - name: seed-mock-infra
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /workspace/mock-infra && cp /mock-data/* /workspace/mock-infra/"]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: mock-data
              mountPath: /mock-data
      containers:
        - name: bob-agent
          image: image-registry.openshift-image-registry.svc:5000/sre-demo/sre-bob:latest
          imagePullPolicy: Always
          env:
            - name: OUTPUT_FILE
              value: /workspace/instana-findings.json
            - name: LOG_FILE
              value: /workspace/instana-query.log
            - name: CHAT_MODE
              value: instana
            - name: BOB_PROMPT
              value: >-
                You are the Instana Query SRE agent. Your task: query the Instana API for current
                incidents and events from the Robot Shop application.
                Use environment variables INSTANA_BASE_URL and INSTANA_API_TOKEN for authentication.
                Run: curl -s -H "authorization: apiToken $INSTANA_API_TOKEN"
                "$INSTANA_BASE_URL/api/events?windowSize=3600000&to=$(date +%s)000"
                Parse the response and identify the most critical active incident.
                Write the findings as valid JSON to /workspace/instana-findings.json following
                the instana-findings.json schema in your mode instructions.
                Include status, completed_at, incidents array, top_incident object, and summary.
            - name: BOBSHELL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sre-credentials
                  key: BOBSHELL_API_KEY
            - name: BOB_GATEWAY_URL
              valueFrom:
                secretKeyRef:
                  name: sre-credentials
                  key: BOB_GATEWAY_URL
            - name: INSTANA_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: sre-credentials
                  key: INSTANA_BASE_URL
            - name: INSTANA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sre-credentials
                  key: INSTANA_API_TOKEN
            - name: HOME
              value: /bob-home
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: sre-workspace
        - name: mock-data
          configMap:
            name: mock-infra-data